recipe_version: "2"
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
model_revision: 7b719225242aacd3dbd3f9407468c2ee9a9d2594
runtime: vllm-distributed
min_nodes: 1
max_nodes: 1
executor: docker
container: vllm/vllm-openai@sha256:3b0e188ffceb3d07e09c3cb5215433a0020eacf02d7f882ed3a8bfd15454477e
mods:
  - qwen38-source-overlay
metadata:
  description: Qwen3.8-Flash-Next NVFP4, single DGX Spark, adaptive scheduler and exact PLE path
  maintainer: salmanarshad321
  model_dtype: nvfp4
  kv_dtype: bf16
defaults:
  host: 0.0.0.0
  port: 8000
  served_model_name: qwen3.8-flash-next
  max_model_len: 262144
  max_num_seqs: 8
  gpu_memory_utilization: 0.80
  max_num_batched_tokens: 8192
  max_num_scheduled_tokens: 8192
  kv_cache_dtype: auto
env:
  PYTHONPATH: /opt/qwen-adaptive
  VLLM_MTP_DRAFT_VOCAB: /draft-vocab/draft_vocab_en_code_47k.txt
  VLLM_QSA_EXACT_TOPK: "0"
  VLLM_QSA_DET_TOPK: "1"
  VLLM_QSA_QUERY_PACKING: "1"
  VLLM_PLE_MMAP: "1"
  VLLM_PLE_MMAP_FAST_ROWS: "0"
  VLLM_PLE_MMAP_MADVISE: random
  VLLM_PLE_MMAP_PREWARM: "1"
  VLLM_PLE_MMAP_WORKERS: "32"
  VLLM_PLE_ROW_CACHE_MIB: "64"
  VLLM_PLE_STAGED: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_FP8_HYBRID: "0"
  QWEN_ADAPTIVE_PREFILL_LOW: "4096"
executor_config:
  entrypoint: ""
  privileged: false
  user: "0:0"
  ipc: host
  network: host
  auto_remove: false
command: |
  vllm serve {model} --revision {model_revision} \
    --served-model-name {served_model_name} --host {host} --port {port} \
    --load-format safetensors --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching --enable-chunked-prefill \
    --max-num-batched-tokens {max_num_batched_tokens} \
    -cc.cudagraph_mode=FULL_AND_PIECEWISE \
    -cc.splitting_ops='["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::qwen3_8_flash_next_ple_short_conv","vllm::qwen3_8_flash_next_qsa_with_output","vllm::linear_attention","vllm::qwen_gdn_attention_core","vllm::qwen_gdn_attention_core_fused_norm_packed","vllm::sparse_attn_indexer","vllm::ple_mmap_lookup"]' \
    --no-enable-flashinfer-autotune --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder --reasoning-parser qwen3 \
    --speculative-config '{"disable_eagle_block_drop":true,"method":"mtp","num_speculative_tokens":3,"use_local_argmax_reduction":true}' \
    --max-num-scheduled-tokens {max_num_scheduled_tokens} --kv-cache-dtype {kv_cache_dtype} \
    --safetensors-load-strategy eager -cc.mode=3 \
    -cc.cudagraph_capture_sizes='[1,2,3,4,5,6,7,8,12,16,20,24,28,32,40,48,56,64]' \
    -cc.max_cudagraph_capture_size=64 \
    --scheduler-cls adaptive_scheduler.AdaptiveAsyncScheduler --async-scheduling
